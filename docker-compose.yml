services:
  db:
    image: postgres:16-alpine
    container_name: cloudops-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: cloudops
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $admin -d $cloudops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: